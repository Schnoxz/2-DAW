<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 Error en tiempo de ejecución</title>
</head>
<body>
    <script>
        let x = 20;
        console.log("X vale: " + x);

        console.log("Intentan sumar x + b, pero b no está definido.");

        let resultado = x + b; // Esto generará un error porque b no está definido

        console.log("El resultado es: " + resultado);
        // Debería mostrar un error explicando así el funcionamiento de js, al ser un lenguaje dinámico que se ejecuta en el propio navegador,al contrario que java, el código se ejecuta hasta que encuentra un error, y en ese momento se detiene la ejecución del mismo.
    </script>
    
    
</body>
</html>
