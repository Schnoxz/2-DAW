<!DOCTYPE html>
<html>
<body>
<h1>Cadenas de JavaScript</h1>
<h2>El método padStart()</h2>
<p>El método padStart() rellena una cadena desde el principio.</p>
<p>Rellena la cadena con otra cadena (múltiples veces) hasta que alcanza una longitud
determinada.</p>
<p id="demo"></p>
<script>
let text = "5";
text = text.padStart(4,"0");
document.getElementById("demo").innerHTML = text;
</script>
</body>
</html>
