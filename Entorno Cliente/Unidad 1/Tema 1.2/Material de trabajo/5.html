<!DOCTYPE html>
<!--
Ejercicio 5:
Adaptar el mismo ejercicio para que las salidas en los tres idiomas se impriman únicamente a través de la consola del desarrollador.
-->
<html>
<body>
  <!-- En este ejercicio no cambio la página como pasa en el ejercicio 4; solo escribo el saludo en la consola. -->
  <h1>Saludo en tu idioma (solo consola)</h1>

  <!-- Al hacer clic, la página no cambia: el saludo solo se muestra por la consola -->
  <button type="button" onclick="console.log('Привет!')">Ruso</button>
  <button type="button" onclick="console.log('¡Hola!')">Español</button>
  <button type="button" onclick="console.log('Hello!')">Inglés</button>
</body>
</html>
