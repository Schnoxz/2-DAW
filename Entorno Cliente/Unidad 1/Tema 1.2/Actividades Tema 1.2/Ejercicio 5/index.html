<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5 - Saludo multidioma solo por consola</title>
</head>
<body>

  <h1>Saludo en tu idioma (solo consola)</h1>
  <p>Abre la consola (F12) y pulsa los botones; la salida no modifica la página.</p>

  <button type="button" onclick="saludar('ru')">Ruso</button>
  <button type="button" onclick="saludar('es')">Español</button>
  <button type="button" onclick="saludar('en')">Inglés</button>

  <script>
    const saludos = {
      ru: { texto: 'Привет!', color: 'purple' },
      es: { texto: '¡Hola!', color: 'green' },
      en: { texto: 'Hello!', color: 'blue' }
    };

    // Solo consola: no modifica el DOM, escribe el saludo y su color en F12.
    function saludar(idioma) {
      const s = saludos[idioma];
      console.log(s.texto + ' (color sugerido: ' + s.color + ')');
    }
  </script>

</body>
</html>
