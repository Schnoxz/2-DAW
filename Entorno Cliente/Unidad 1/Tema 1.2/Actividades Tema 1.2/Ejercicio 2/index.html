<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2 - Evento clic con console.log()</title>
</head>
<body>

  <h1>Traza informativa</h1>
  <p>Abre las herramientas de desarrollo (F12) y pulsa el botón.</p>

  <button type="button" id="btn">Emitir traza</button>

  <script>
    // addEventListener separa el comportamiento del HTML y admite varias escuchas.
    document.getElementById('btn').addEventListener('click', function () {
      // console.log() solo escribe en la consola; no altera la página.
      console.log('Se ha capturado el evento clic del botón.');
    });
  </script>

</body>
</html>
