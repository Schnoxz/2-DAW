<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        form {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input, select, button {
            padding: 6px;
        }
        #error {
            color: red;
            font-weight: bold;
            margin: 0;
        }
        p {
            margin: 0;
        }
    </style>
</head>
<body>
    <form>
        <label for="precio-base">Precio base</label>
        <input type="number" id="precio-base" name="precio-base" min="0" step="0.01" required>

        <label for="tipo-iva">Tipo de IVA</label>
        <select id="tipo-iva" name="tipo-iva">
            <option value="21">21% (general)</option>
            <option value="10">10% (reducido)</option>
            <option value="4">4% (superreducido)</option>
        </select>

        <button type="button" id="calcular">Calcular</button>

        <p id="error" hidden></p>
        <p id="desglose"></p>
    </form>

    <script>
        const precioInput = document.getElementById('precio-base');
        const ivaSelect = document.getElementById('tipo-iva');
        const errorMsg = document.getElementById('error');
        const desglose = document.getElementById('desglose');

        document.getElementById('calcular').addEventListener('click', () => {
            debugger;
            const base = Number(precioInput.value);
            console.log('Precio base leído:', base);
            errorMsg.hidden = true;
            errorMsg.textContent = '';

            if (!Number.isFinite(base) || base <= 0) {
                console.log('Validación fallida: precio no es número válido > 0');
                errorMsg.textContent = 'Introduce un precio válido mayor que 0.';
                errorMsg.hidden = false;
                desglose.textContent = '';
                return;
            }

            const tipo = Number(ivaSelect.value);
            console.log('Tipo de IVA seleccionado:', tipo, '%');
            const iva = base * tipo / 100;
            console.log('Importe IVA:', iva);
            const total = base + iva;
            console.log('Precio final:', total);
            const fmt = (n) => n.toFixed(2).replace('.', ',') + ' €';

            desglose.textContent = `Base: ${fmt(base)} \u00b7 IVA (${tipo}%): ${fmt(iva)} \u00b7 Total: ${fmt(total)}`;
        });
    </script>
</body>
</html>
