<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.3.1 · Cambiar el aspecto de una caja</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Actividad 3.3.1 · Cambiar el aspecto con classList</h1>
        <p class="subtitulo">La caja empieza con 200 × 100 px y borde rojo; el botón añade una clase que la agranda y cambia el borde.</p>
        <nav><a href="index.html">← Volver al índice</a></nav>
    </header>

    <main>
        <section class="panel">
            <h2>Caja de prueba</h2>

            <!-- Las medidas y el borde inicial salen de la clase .caja-inicial -->
            <div id="caja" class="caja-inicial">Caja inicial</div>

            <div class="botones-accion">
                <button id="btn-cambiar">Cambiar aspecto</button>
                <button id="btn-restablecer" class="secundario">Restablecer</button>
            </div>
        </section>
    </main>

    <script src="js/clases.js"></script>
</body>
</html>
