<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.3.3 · Panel de control con classList</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Actividad 3.3.3 · Panel de control</h1>
        <p class="subtitulo">Ejemplo de <code>classList</code> del tema, con el estado de error y el texto del botón de modo oscuro.</p>
        <nav><a href="index.html">← Volver al índice</a></nav>
    </header>

    <main>
        <section class="panel">
            <h2>Botones de acción</h2>

            <div class="botones-accion">
                <button id="btn-oscuro">Modo Oscuro</button>
                <button id="btn-ocultar" class="secundario">Ocultar / Mostrar</button>
                <button id="btn-exito">Completar Tarea</button>
                <button id="btn-error" class="secundario">Marcar Error</button>
                <button id="btn-borde" class="secundario">Resaltar</button>
                <button id="btn-reset" class="secundario">Reiniciar</button>
            </div>

            <!-- La tarjeta arrastra siempre la clase .caja; el estado va aparte -->
            <div id="tarjeta" class="caja estado-pendiente">
                Estado actual: tarea pendiente de revisión.
            </div>
        </section>
    </main>

    <script src="js/tarjeta.js"></script>
</body>
</html>
