<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140" font-family="Segoe UI, Arial, sans-serif">
  <!-- Marca de TachoAviso: una caja de aviso con un reloj dentro y una carretera debajo -->
  <rect width="420" height="140" rx="18" fill="#0f172a"/>

  <!-- Reloj: el aviso llega antes de que caduque el plazo -->
  <circle cx="70" cy="70" r="38" fill="#16a34a"/>
  <circle cx="70" cy="70" r="29" fill="#ffffff"/>
  <line x1="70" y1="70" x2="70" y2="50" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="70" x2="86" y2="78" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="70" r="4" fill="#0f172a"/>

  <!-- Carretera: el sector al que se dirige -->
  <line x1="30" y1="118" x2="110" y2="118" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>

  <!-- Nombre -->
  <text x="132" y="66" font-size="40" font-weight="bold" fill="#ffffff">TachoAviso</text>
  <text x="134" y="96" font-size="16" fill="#86efac">Tus plazos, avisados a tiempo</text>
</svg>
