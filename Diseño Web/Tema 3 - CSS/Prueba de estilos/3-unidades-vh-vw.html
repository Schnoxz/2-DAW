<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vh y vw</title>
  <style>
    body {
      margin: 1rem;
      font-family: system-ui, sans-serif;
    }

    .elemento {
      height: 50vh;
      width: 75vw;
    }

    .elemento img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .contenedor {
      margin-top: 10vh;
      margin-right: 5vw;
    }

    .contenedor img {
      width: 30vw;
      height: 20vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="elemento">
    <img src="img/plaza-alta.jpg" alt="Plaza Alta">
  </div>

  <div class="contenedor">
    <p>margin-top: 10vh; margin-right: 5vw;</p>
    <img src="img/puerto.jpg" alt="Puerto">
  </div>
</body>
</html>
