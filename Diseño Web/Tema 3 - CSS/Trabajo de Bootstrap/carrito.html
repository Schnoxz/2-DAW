<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito - Librería Kursaal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Librería Kursaal</a>
      <div>
        <a class="text-white me-3" href="index.html">Inicio</a>
        <a class="text-white" href="carrito.html">Carrito</a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="mb-4">Tu carrito</h1>

    <table class="table tabla-carrito" id="tabla-carrito">
      <thead>
        <tr>
          <th>Libro</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Importe</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cuerpo-carrito">
        <!-- Aquí JavaScript escribe los libros del carrito -->
      </tbody>
    </table>

    <div class="row justify-content-end">
      <div class="col-md-4">
        <p class="d-flex justify-content-between">
          <span>Subtotal</span>
          <span id="subtotal">0,00 €</span>
        </p>
        <p class="d-flex justify-content-between">
          <span>IVA (4 %)</span>
          <span id="iva">0,00 €</span>
        </p>
        <p class="d-flex justify-content-between">
          <span>Envío</span>
          <span id="envio">0,00 €</span>
        </p>
        <hr>
        <p class="d-flex justify-content-between fs-5">
          <strong>Total</strong>
          <strong id="total">0,00 €</strong>
        </p>

        <a href="checkout.html" class="btn btn-primary w-100">Continuar con la compra</a>
        <a href="index.html" class="btn btn-link w-100">Seguir comprando</a>
      </div>
    </div>
  </main>

  <footer class="container-fluid text-center text-white mt-5">
    <p class="mb-0 py-3">Librería Kursaal - Trabajo de Bootstrap</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
