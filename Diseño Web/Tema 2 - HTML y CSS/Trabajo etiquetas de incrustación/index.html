<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Principal</title>
<style>
/* Estilos para el cuerpo de la página */
body{font-family:Arial;background:#fff;color:#000}

/* Estilos para los encabezados, colo color de fondo, padding y redondeados  */
h1,h2{color:#333; background: #f5f5f5; padding:10px; border-radius:5px}

/* Estilos para la barra de navegación, color de fondo e igual que los h1-h2 */
nav{background:#e5e5e5; padding:10px; border-radius:5px}

/* Estilos para los enlaces, color de texto */
a{color:#333}

/* Estilos para imágenes, vídeos, audio, ancho de 300px */
img,video,audio{width:300px}

/* Estilos para el canvas, simplemente un borde dibujado para saber dónde está */
canvas{border:1px solid #ccc}

/* Estilos para embed y object, ancho de 300px y altura de 200px */
embed,object{width:300px;height:200px}
</style>
</head>
<body>

<header>
<h1 style="background:#e5e5e5;">Contenido incrustado</h1>
</header>

<nav><a href="index.html">Principal</a> | <a href="detalle.html">Iframe</a></nav>

<main>

<section>
<!-- Muestra una imagen externa -->
<h2>img</h2>
<img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="img">
</section>

<section>
<!-- Reproduce un vídeo con controles -->
<h2>video</h2>
<video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
</section>

<section>
<!-- Reproduce un audio con controles -->
<h2>audio</h2>
<audio src="https://www.w3schools.com/html/horse.mp3" controls></audio>
</section>

<section>
<!-- Lienzo vacío para dibujo -->
<h2>canvas</h2>
<canvas width="200" height="100"></canvas>
</section>

<section>
<!-- Incrusta contenido externo -->
<h2>embed</h2>
<embed src="https://www.w3schools.com/html/pic_trulli.jpg" type="image/jpeg" width="300" height="200">
</section>

<section>
<!-- Incrusta un objeto con texto alternativo -->
<h2>object</h2>
<object data="https://www.w3schools.com/html/img_girl.jpg" type="image/jpeg" width="300" height="200">No se puede mostrar el objeto</object>
</section>

<section>
<!-- Gráfico vectorial en línea -->
<h2>svg</h2>
<svg width="100" height="100"><circle cx="50" cy="50" r="40" stroke="#666" stroke-width="2" fill="#e6e6e6"/></svg>
</section>

</main>

</body>
</html>
