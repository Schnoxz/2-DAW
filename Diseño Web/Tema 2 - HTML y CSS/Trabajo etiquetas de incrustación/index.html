<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Algeciras Digital - Inicio</title>
  <!-- Trabajo: etiquetas de incrustación (img, iframe, video, audio) -->
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #1b3a6b;
      color: #ffffff;
    }
    nav a {
      color: #ffffff;
    }
    h1, h2, h3 {
      color: #1b3a6b;
    }
    main {
      background-color: #ffffff;
    }
    footer {
      background-color: #1b3a6b;
      color: #ffffff;
    }
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #000000;
    }
    th {
      background-color: #1b3a6b;
      color: #ffffff;
    }
    .destacado {
      color: #1b3a6b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Algeciras Digital</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="detalle.html">Detalle</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Imagen</h2>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Algeciras_%28Spain%29_%28cropped%29.jpg/400px-Algeciras_%28Spain%29_%28cropped%29.jpg" alt="Vista de Algeciras">
    </section>

    <section>
      <h2>Vídeo</h2>
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
    </section>

    <section>
      <h2>Audio</h2>
      <audio src="https://www.w3schools.com/html/horse.mp3" controls></audio>
    </section>

    <section>
      <h2>Iframe</h2>
      <iframe src="https://es.wikipedia.org/wiki/Algeciras" width="400" height="250"></iframe>
    </section>

    <section>
      <h2>Datos</h2>
      <table>
        <tr>
          <th>Concepto</th>
          <th>Valor</th>
        </tr>
        <tr>
          <td>Población</td>
          <td>123.000</td>
        </tr>
        <tr>
          <td>Provincia</td>
          <td>Cádiz</td>
        </tr>
      </table>
    </section>

    <section>
      <p class="destacado">Trabajo centrado en etiquetas de incrustación siguiendo la teoría vista.</p>
    </section>
  </main>

  <footer>
    <p>Algeciras Digital - Diseño de Interfaces Web</p>
  </footer>
</body>
</html>
