<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iframe</title>
<style>
body{font-family:Arial;background:#fff;color:#000}
h1,h2{color:#333; background: #f5f5f5; padding:10px; border-radius:5px}
nav{background:#e5e5e5; padding:10px; border-radius:5px}
a{color:#333}
/* Estilos para el iframe, dibujando un border con un ancho y una altura donde se situará el contenido*/
iframe{width:400px;height:250px;border:1px solid #ccc}
</style>
</head>
<body>

<header>
<h1 style="background:#e5e5e5;">Iframe</h1>
</header>

<nav><a href="index.html">Principal</a> | <a href="detalle.html">Iframe</a></nav>

<main>

<section>
<!-- Incrusta una página web externa -->
<h2>Wikipedia</h2>
<iframe src="https://es.wikipedia.org/wiki/HTML"></iframe>
</section>

<section>
<!-- Incrusta un mapa con las coordenadas locales-->
<h2>Mapa</h2>
<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-5.453,36.126,-5.445,36.132&layer=mapnik"></iframe>
</section>

</main>

</body>
</html>
