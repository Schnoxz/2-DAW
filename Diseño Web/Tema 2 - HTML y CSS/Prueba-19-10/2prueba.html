<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reserva de pista</title>
  <style>
    body{font-family:system-ui;margin:1rem;max-width:600px}
    fieldset{border: 1px solid #ccc;padding:1rem;margin-bottom:1.5rem}
    fieldset.borde-grueso{border: 10px solid #ccc}
    fieldset.borde-fino{border: 1px solid #ccc}
    label{display:block;margin-top:.7rem}
    input[type=range]{width:100%}
  </style>
</head>
<body>
  <h1>Reserva tu pista deportiva</h1>

  <!-- Formulario 1: borde de 10px -->
  <form action="#" aria-describedby="ayuda-nivel-1">
    <fieldset class="borde-grueso">
      <legend>Datos de reserva (borde 10px)</legend>

      <label>Nombre
        <input type="text" name="nombre" required />
      </label>

      <label>E‑mail
        <input type="email" name="email" required />
      </label>

      <label>Fecha
        <input type="date" name="fecha" required />
      </label>

      <p>Turno</p>
      <label><input type="radio" name="turno" value="mañana" required /> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"  required /> Tarde</label>

      <label>Nivel (1 bajo – 10 pro)
        <input type="range" name="nivel" min="1" max="10" value="5" aria-describedby="ayuda-nivel-1" />
      </label>
      <small id="ayuda-nivel-1">Selecciona tu nivel aproximado.</small>

      <label>
        <input type="checkbox" name="seguro" /> Contratar seguro de lesiones
      </label>
    </fieldset>

    <button type="submit">Reservar</button>
  </form>

  <!-- Formulario 2: borde de 1px -->
  <form action="#" aria-describedby="ayuda-nivel-2">
    <fieldset class="borde-fino">
      <legend>Datos de reserva (borde 1px)</legend>

      <label>Nombre
        <input type="text" name="nombre" required />
      </label>

      <label>E‑mail
        <input type="email" name="email" required />
      </label>

      <label>Fecha
        <input type="date" name="fecha" required />
      </label>

      <p>Turno</p>
      <label><input type="radio" name="turno" value="mañana" required /> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"  required /> Tarde</label>

      <label>Nivel (1 bajo – 10 pro)
        <input type="range" name="nivel" min="1" max="10" value="5" aria-describedby="ayuda-nivel-2" />
      </label>
      <small id="ayuda-nivel-2">Selecciona tu nivel aproximado.</small>

      <label>
        <input type="checkbox" name="seguro" /> Contratar seguro de lesiones
      </label>
    </fieldset>

    <button type="submit">Reservar</button>
  </form>
</body>
</html>
