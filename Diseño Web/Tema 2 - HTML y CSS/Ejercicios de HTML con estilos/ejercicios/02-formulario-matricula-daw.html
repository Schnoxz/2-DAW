<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrícula en el ciclo DAW</title>
  <!--
    Ejercicio 2 - Formularios: form, label, input, select, textarea y fieldset.
    Fuente de los datos: https://www.todofp.es/que-estudiar/loe/informatica-comunicaciones/des-aplicaciones-web.html
  -->
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6fa; margin: 0; padding: 30px; }
    h1 { color: #1b3a6b; text-align: center; }
    form { max-width: 520px; margin: 0 auto; background-color: #fff; padding: 24px; border-radius: 8px; }
    label { display: block; margin-top: 12px; font-weight: bold; color: #333; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #bbb; border-radius: 4px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin-top: 16px; }
    button { margin-top: 18px; width: 100%; padding: 10px; background-color: #1b3a6b; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .fuente { font-size: 0.8rem; color: #555; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <h1>Matrícula en el ciclo DAW</h1>

  <form action="#" method="post">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="apellidos">Apellidos</label>
    <input type="text" id="apellidos" name="apellidos" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required>

    <label for="fecha">Fecha de nacimiento</label>
    <input type="date" id="fecha" name="fecha">

    <label for="modalidad">Modalidad</label>
    <select id="modalidad" name="modalidad">
      <option value="presencial">Presencial</option>
      <option value="semipresencial">Semipresencial</option>
      <option value="distancia">A distancia</option>
    </select>

    <fieldset>
      <legend>Módulos matriculados</legend>
      <label><input type="checkbox" name="modulo" value="dwec" checked> DWEC</label>
      <label><input type="checkbox" name="modulo" value="dwes" checked> DWES</label>
      <label><input type="checkbox" name="modulo" value="diw" checked> DIW</label>
      <label><input type="checkbox" name="modulo" value="despliegue" checked> Despliegue</label>
    </fieldset>

    <label for="observaciones">Observaciones</label>
    <textarea id="observaciones" name="observaciones" rows="3"></textarea>

    <button type="submit">Enviar solicitud</button>
  </form>

  <p class="fuente">
    Fuente: <a href="https://www.todofp.es/que-estudiar/loe/informatica-comunicaciones/des-aplicaciones-web.html">todoFP – Desarrollo de Aplicaciones Web</a>
  </p>
</body>
</html>
