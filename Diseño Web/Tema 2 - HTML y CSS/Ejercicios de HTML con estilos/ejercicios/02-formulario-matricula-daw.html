<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de matrícula DAW</title>
  <!-- Ejercicio 2: formularios - etiquetas form, input, select, label -->
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #1b3a6b;
    }
    form {
      width: 400px;
    }
    label {
      display: block;
    }
    input, select {
      width: 100%;
    }
    .fuente {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <h1>Matrícula en el ciclo DAW</h1>

  <form action="#" method="post">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="apellidos">Apellidos:</label>
    <input type="text" id="apellidos" name="apellidos" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>

    <label for="fecha">Fecha de nacimiento:</label>
    <input type="date" id="fecha" name="fecha">

    <label for="modalidad">Modalidad:</label>
    <select id="modalidad" name="modalidad">
      <option value="presencial">Presencial</option>
      <option value="semipresencial">Semipresencial</option>
      <option value="distancia">A distancia</option>
    </select>

    <br><br>
    <input type="submit" value="Enviar solicitud">
  </form>

  <p class="fuente">
    Fuente: <a href="https://www.todofp.es/que-estudiar/loe/informatica-comunicaciones/des-aplicaciones-web.html">todofp.es - Desarrollo de Aplicaciones Web</a>
  </p>
</body>
</html>
