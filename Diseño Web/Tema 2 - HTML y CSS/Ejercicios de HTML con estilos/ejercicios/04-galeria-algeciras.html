<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería de Algeciras</title>
  <!-- Ejercicio 4: imágenes con HTML y estilos básicos -->
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #1b3a6b;
    }
    img {
      width: 300px;
    }
    figure {
      display: inline-block;
    }
    figcaption {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Galería de Algeciras</h1>

  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Algeciras_%28Spain%29_%28cropped%29.jpg/320px-Algeciras_%28Spain%29_%28cropped%29.jpg" alt="Vista de Algeciras">
    <figcaption>Vista general de Algeciras</figcaption>
  </figure>

  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Port_of_Algeciras.jpg/320px-Port_of_Algeciras.jpg" alt="Puerto de Algeciras">
    <figcaption>Puerto de Algeciras</figcaption>
  </figure>

  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Plaza_Alta_de_Algeciras_%281%29.jpg/320px-Plaza_Alta_de_Algeciras_%281%29.jpg" alt="Plaza Alta">
    <figcaption>Plaza Alta de Algeciras</figcaption>
  </figure>
</body>
</html>
