<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galeria de Algeciras</title>
  <!-- Ejercicio 4: galeria de imagenes. Fuente: https://es.wikipedia.org/wiki/Algeciras -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333333;
    }
    h1 {
      color: #1b3a6b;
    }
    .foto {
      width: 30%;
      margin: 5px;
      border: 1px solid #999999;
    }
    .fuente {
      background-color: #f0f0f0;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h1>Galeria de Algeciras</h1>
  <p>Algunos lugares de la ciudad:</p>

  <img class="foto" src="assets/plaza-alta.svg" alt="Plaza Alta">
  <img class="foto" src="assets/puerto.svg" alt="Puerto de Algeciras">
  <img class="foto" src="assets/isla-verde.svg" alt="Isla Verde">
  <img class="foto" src="assets/getares.svg" alt="Playa de Getares">
  <img class="foto" src="assets/rio-miel.svg" alt="Rio de la Miel">
  <img class="foto" src="assets/centenario.svg" alt="Parque del Centenario">

  <p class="fuente">
    Fuente: <a href="https://es.wikipedia.org/wiki/Algeciras">https://es.wikipedia.org/wiki/Algeciras</a>
  </p>

</body>
</html>
