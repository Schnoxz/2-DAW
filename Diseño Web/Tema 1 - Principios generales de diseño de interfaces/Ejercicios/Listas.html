<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Listas</title>
</head>
<body>

	<h1>Listas ordenadas y desordenadas</h1>

	<!-- type="a"  start="3" empieza por la letra c -->
	<ol type="a" start="2">
		<li>a</li>
		<li>b</li>
		<li>c</li>
	</ol>

	<ul>
		<li>a</li>
		<li>b</li>
		<li>c</li>
	</ul>

</body>
</html>
